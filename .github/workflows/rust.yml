name: Rust

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write # temporary: track the updated generated lockfile after checks

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Linux UI build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Resolve updated application lockfile
        run: cargo generate-lockfile
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Compile all targets
        run: cargo check --locked --all-targets
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked --all-targets
      - name: Commit validated dependency lockfile
        if: success() && github.event_name == 'push'
        run: |
          if [ -n "$(git status --porcelain -- Cargo.lock)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock
            git commit -m "chore: lock dictionary storage dependencies"
            git push origin HEAD:main
          fi
