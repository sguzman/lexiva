name: Rust

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Linux UI build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Verify tracked dependency lockfile
        run: test -s Cargo.lock
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Compile all targets
        run: cargo check --locked --all-targets
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked --all-targets
      - name: Install real FreeDict packages for independent source QA
        run: |
          sudo apt-get install -y --no-install-recommends dict-freedict-spa-eng dict-freedict-eng-spa gzip
          test -s /usr/share/dictd/freedict-spa-eng.index
          test -s /usr/share/dictd/freedict-eng-spa.index
      - name: Test actual installed FreeDict dictionaries
        run: cargo test --locked --all-targets -- --ignored --nocapture
