name: Rust

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Linux UI build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Verify tracked dependency lockfile
        run: test -s Cargo.lock
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Compile all targets
        run: cargo check --locked --all-targets
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked --all-targets
      - name: Install real FreeDict packages for independent source QA
        run: |
          sudo apt-get install -y --no-install-recommends dict-freedict-spa-eng dict-freedict-eng-spa gzip
          test -s /usr/share/dictd/freedict-spa-eng.index
          test -s /usr/share/dictd/freedict-eng-spa.index
      - name: Test actual installed FreeDict dictionaries
        run: cargo test --locked --all-targets dict::real_freedict_tests::installed_freedict_packages_agree_with_independent_gzip -- --ignored --nocapture
      - name: Stress-test 150k Wiktextract records, cancellation, reimport, and memory
        run: cargo test --locked --all-targets wiktextract::large_tests::corpus_150k_records_import_cancel_reimport_and_measure_resources -- --ignored --nocapture
      - name: Fetch authentic raw per-word Wiktextract data
        run: |
          curl --fail --location --retry 3 --max-time 90 --max-filesize 2000000 --silent --show-error \
            --output /tmp/lexiva-enwiktionary-casas.jsonl \
            'https://kaikki.org/dictionary/Spanish/meaning/c/ca/cas%C3%A1s.jsonl'
          curl --fail --location --retry 3 --max-time 90 --max-filesize 2000000 --silent --show-error \
            --output /tmp/lexiva-eswiktionary-caso.jsonl \
            'https://kaikki.org/eswiktionary/Espa%C3%B1ol/meaning/c/ca/caso.jsonl'
          test -s /tmp/lexiva-enwiktionary-casas.jsonl
          test -s /tmp/lexiva-eswiktionary-caso.jsonl
      - name: Test authentic English- and Spanish-edition Wiktextract records
        env:
          LEXIVA_EN_REAL_JSONL: /tmp/lexiva-enwiktionary-casas.jsonl
          LEXIVA_ES_REAL_JSONL: /tmp/lexiva-eswiktionary-caso.jsonl
        run: cargo test --locked --all-targets wiktextract::real_tests::authentic_ -- --ignored --nocapture
